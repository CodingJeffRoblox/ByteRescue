name: ByteRescue CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install package
        run: python -m pip install -e .

      - name: Compile Python sources
        run: python -m compileall byterescue

      - name: Check package import
        run: python -c "import byterescue; print(f'ByteRescue version: {byterescue.__version__}')"

      - name: Check module entry point
        run: python -c "from byterescue.__main__ import main; print('Module entry point OK')"
